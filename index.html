look<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Woodlark Associates</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
  font-family: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #fff;
}

/* Background video */
#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.05);
  z-index: 1;
  filter: brightness(95%) contrast(110%) saturate(105%);
}

/* Atmospheric overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,10,20,0.28);
  z-index: 2;
  pointer-events: none;
}

/* Layout */
.content {
  position: relative;
  z-index: 3;
  min-height: 100dvh; /* fixes iOS centring */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}

/* Logo dissolve */
.logo {
  width: min(70vw, 420px);
  max-width: 420px;
  height: auto;
  filter: drop-shadow(0 12px 30px rgba(0,0,0,0.6));
  opacity: 0;
  transform: translateY(8px);
  animation: fadeInLogo 2.6s ease 0.4s forwards;
}

@keyframes fadeInLogo {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Email */
.contact {
  margin-top: 40px;
  font-size: 13px;
  letter-spacing: 1.6px;
  opacity: 0.8;
}

.contact a {
  color: #fff;
  text-decoration: none;
  transition: opacity 0.3s ease;
}

.contact a:hover {
  opacity: 0.6;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  #bg-video { display: none; }
  .overlay { background: #000; }
  .logo {
    animation: none;
    opacity: 1;
    transform: none;
  }
}
</style>
</head>

<body>

<video
  id="bg-video"
  autoplay
  muted
  loop
  playsinline
  preload="auto">
</video>

<div class="overlay"></div>

<main class="content">
  <img class="logo" src="woodlark.png" alt="Woodlark Associates Logo" />
  <div class="contact">
    <a href="mailto:hello@woodlarkassociates.co.uk">
      hello@woodlarkassociates.co.uk
    </a>
  </div>
</main>

<script>
(function () {
  const video = document.getElementById("bg-video");
  const videos = ["background1.mp4", "background2.mp4"];
  let chosen = videos[0];

  try {
    const key = "woodlarkVideo";
    const last = localStorage.getItem(key);
    chosen = (last === videos[0]) ? videos[1] : videos[0];
    localStorage.setItem(key, chosen);
  } catch (e) {
    chosen = videos[Math.floor(Math.random() * videos.length)];
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  video.src = chosen;
  video.load();

  const attemptPlay = () => video.play().catch(() => {});
  video.addEventListener("loadeddata", attemptPlay, { once: true });
  video.addEventListener("canplay", attemptPlay, { once: true });
  attemptPlay();
})();
</script>

</body>
</html>
