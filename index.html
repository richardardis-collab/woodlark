<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Woodlark Associates</title>

<style>
  :root{
    --tint: rgba(5,10,20,0.25);
    --text: rgba(255,255,255,0.70);
  }

  html, body{
    height: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Avenir, "Avenir Next", "Avenir Next LT Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Background video */
  #bg-video{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.05);
    z-index: 1;
    filter: brightness(95%) contrast(115%) saturate(105%);
  }

  /* Subtle atmospheric tint */
  .overlay{
    position: fixed;
    inset: 0;
    background: var(--tint);
    z-index: 2;
    pointer-events: none;
  }

  /* Centre content */
  .content{
    position: relative;
    z-index: 3;
    height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: centre;
  }

  /* Logo dissolve */
  .logo{
    max-width: 420px;
    width: min(70vw, 420px);
    height: auto;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,0.55));
    opacity: 0;
    transform: translateY(6px);
    animation: fadeInLogo 3s ease 0.5s forwards;
  }

  @keyframes fadeInLogo{
    to { opacity: 1; transform: translateY(0); }
  }

  /* Contact */
  .contact{
    margin-top: 36px;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text);
    opacity: 0;
    animation: fadeInContact 2.4s ease 1.1s forwards;
  }

  @keyframes fadeInContact{
    to { opacity: 1; }
  }

  .contact a{
    color: inherit;
    text-decoration: none;
    transition: opacity 220ms ease;
  }

  .contact a:hover{
    opacity: 1;
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce){
    #bg-video{ display: none; }
    .overlay{ background: #000; }
    .logo{ animation: none; opacity: 1; transform: none; }
    .contact{ animation: none; opacity: 1; }
  }
</style>
</head>

<body>

<!-- Autoplay attributes must be present on the tag for Safari -->
<video id="bg-video" autoplay muted loop playsinline preload="auto"></video>
<div class="overlay"></div>

<main class="content">
  <div>
    <img class="logo" src="woodlark.png" alt="Woodlark Associates" />
    <p class="contact">
      <a href="mailto:hello@woodlarkassociates.co.uk">hello@woodlarkassociates.co.uk</a>
    </p>
  </div>
</main>

<script>
  (function () {
    const video = document.getElementById("bg-video");
    const videos = ["/background1.mp4", "/background2.mp4"];
    let chosen = videos[0];

    // Alternate using localStorage, fall back to random if blocked
    try {
      const key = "woodlarkVideo";
      const last = localStorage.getItem(key);
      chosen = (last === videos[0]) ? videos[1] : videos[0];
      localStorage.setItem(key, chosen);
    } catch (e) {
      chosen = videos[Math.floor(Math.random() * videos.length)];
    }

    const other = (chosen === videos[0]) ? videos[1] : videos[0];

    const setSrcAndPlay = (src) => {
      video.pause();
      video.removeAttribute("src");
      video.load();

      video.src = src;
      video.load();

      const attemptPlay = () => video.play().catch(() => {});
      video.addEventListener("loadeddata", attemptPlay, { once: true });
      video.addEventListener("canplay", attemptPlay, { once: true });
      attemptPlay();
    };

    // If chosen video fails, fall back to the other one
    video.addEventListener("error", () => setSrcAndPlay(other), { once: true });

    setSrcAndPlay(chosen);
  })();
</script>

</body>
</html>
